services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data # Redis 데이터 영속화

  # 백엔드
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./AI:/app/AI
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_VWORLD_WFS_URL=/vworld-api/req/wfs
      - CHOKIDAR_USEPOLLING=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend

volumes:
  pgdata:
  redis_data: