services:
  # 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.vworld.kr:211.188.33.95"
  
  # 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_VWORLD_WFS_URL=/vworld-api/req/wfs
      - CHOKIDAR_USEPOLLING=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend